# Aplica las migraciones de supabase/migrations al proyecto de Supabase.
# Se ejecuta manualmente desde GitHub: Actions → "Aplicar migraciones a Supabase" → Run workflow.
# Requiere dos secretos en Settings → Secrets and variables → Actions:
#   SUPABASE_ACCESS_TOKEN  (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   (la contraseña de la base de datos del proyecto)
name: Aplicar migraciones a Supabase

on:
  workflow_dispatch:

jobs:
  migraciones:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: oshmqvbvwlvjsecyoxaw
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.12
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
